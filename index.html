<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/src/assets/img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villa St Jean</title>
       <!-- Apple Touch Icon -->
       <link rel="apple-touch-icon" sizes="180x180" href="/src/assets/img/apple-touch-icon.png">
       <link rel="preconnect" href="https://fonts.googleapis.com">
       <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
       <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
       <!-- Favicon -->
       <link rel="icon" href="/src/assets/img/favicon.png" type="image/x-icon">
       <link rel="shortcut icon" href="/src/assets/img/favicon.png" type="image/x-icon">
   
       <!-- Style CSS -->
       <link rel="stylesheet" href="/src/assets/css/style.css">
        <style>
          /* Surcharge finale et ultime de la couleur du texte du menu déroulant */
          .custom-select-popup,
          .custom-select-popup *,
          .custom-select-popup .q-item,
          .custom-select-popup .q-item__label,
          .custom-select-popup .q-item__section,
          .custom-select-popup .q-item * {
            color: #616161 !important;
          }
          .custom-select-popup .q-item--active,
          .custom-select-popup .q-item--active *,
          .custom-select-popup .q-item--active .q-item__label,
          .custom-select-popup .q-item--active .q-item__section,
          .custom-select-popup .q-item--active .q-item__section * {
            color: #8d162f !important;
            background-color: rgba(141, 22, 47, 0.08) !important;
          }
          
        </style>
  </head>
  <body class="flex-wrap ">
    <div id="app"></div>
    <!-- Google Translate Element (Hidden) -->
    <div id="google_translate_element" style="position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; overflow: hidden;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'fr',
          includedLanguages: 'fr,en',
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
